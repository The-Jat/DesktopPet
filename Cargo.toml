[workspace]
resolver = "2"
members = ["crates/pet-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
