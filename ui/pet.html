<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DesktopPet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="bubble" hidden>
      <strong id="bubble-title"></strong>
      <p id="bubble-text"></p>
      <div id="bubble-actions" hidden>
        <button id="done" type="button">Done</button>
        <button id="snooze" type="button">Snooze</button>
      </div>
    </div>
    <img id="sprite" alt="" draggable="false" />
    <script src="pet.js"></script>
  </body>
</html>
