<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick add</title>
    <link rel="stylesheet" href="quickadd.css" />
  </head>
  <body>
    <form id="form">
      <input id="text" autocomplete="off" spellcheck="false" placeholder="call mom tomorrow at 5pm · water every 45 min · buy milk" />
      <p id="preview" class="hint">Type a reminder. No time? It's saved as a note.</p>
      <p class="keys"><kbd>Enter</kbd> save · <kbd>Esc</kbd> close</p>
    </form>
    <script src="quickadd.js"></script>
  </body>
</html>
